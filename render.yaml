services:
  - type: web
    name: playto-kyc-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn playto_kyc.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-kyc-db
          property: connectionString

databases:
  - name: playto-kyc-db
    databaseName: playtokyc
    user: playtokyc